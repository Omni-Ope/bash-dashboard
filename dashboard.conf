# Thresholds for dashboard.sh
# This file is read as data. It is not executed.
# Warning values should be lower than critical values.
# CPU, memory, swap, and disk values are percentages.
# Load values are per CPU. 1.00 means one full core.
# CONN values are a count of established TCP connections.

CPU_WARN=70
CPU_CRIT=90
MEM_WARN=75
MEM_CRIT=90
SWAP_WARN=40
SWAP_CRIT=75
DISK_WARN=80
DISK_CRIT=90
LOAD_WARN_PER_CPU=0.70
LOAD_CRIT_PER_CPU=1.00
CONN_WARN=100
CONN_CRIT=300
